[project]
name = "idv-server"
dynamic = ["version"]
description = "IDV server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.12.13",
    "alembic>=1.16.2",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.14",
    "hypercorn>=0.17.3",
    "psycopg2-binary>=2.9.10",
    "pydantic-settings>=2.10.1",
    "rich>=14.0.0",
    "sqlmodel>=0.0.24",
    "strawberry-graphql[asgi]>=0.275.5",
    "typer>=0.16.0",
]

[project.scripts]
idv-server = "idv_server.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "./idv_server/__about__.py"
